name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: banana-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banana-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: banana-server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Build Worker (OpenNext, runs build:ui first)
        run: npx opennextjs-cloudflare build
      # Cloudflare limits page: 64 MiB on Free and Paid, "There is no compressed size limit".
      # Gate on the uncompressed size; the gzipped size is printed as a report (docs/worker-size.md).
      - name: Worker size (uncompressed; limit 64 MiB, budget 60 MiB)
        run: npm run worker:size -- --max-mib 60
      - name: Worker startup (local profile; limit 1 s, budget 400 ms)
        run: npm run worker:startup -- --max-ms 400
      - name: Worker size breakdown (largest packages)
        if: always()
        run: npm run worker:breakdown
      - name: Migrations are consistent
        run: npx drizzle-kit check
      - name: Schema has a migration
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            echo "db/schema.ts changed without a migration. Run: npm run db:generate"
            git status --porcelain -- db/migrations
            exit 1
          fi

  e2e:
    # Playwright on Chromium against `next dev` (playwright.config.ts starts it with the test-only
    # sign-in bypass; API and image hosts are mocked). Covers the canvas, the inline canvas in a
    # fake MCP Apps host, the public site with axe in light, dark and Arabic (rtl), and the design
    # gates that need a browser (e2e/design-target-size.spec.ts, SC 2.5.8). The Vitest design
    # gates (tests/design-*.test.ts) run in the server job with the unit tests.
    name: banana-server e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: banana-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: banana-server/package-lock.json
      - run: npm ci
      # CI only: the dev container ships Chromium in /opt/pw-browsers and must never run this.
      # @playwright/test 1.56.1 supports ubuntu24.04-x64 (ubuntu-latest) with --with-deps.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            banana-server/playwright-report/
            banana-server/test-results/
          retention-days: 7
